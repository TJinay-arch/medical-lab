<!-- templates/core/menu.html -->
<nav class="navbar navbar-expand-lg p-0">
    <div class="container-fluid p-0">

        <!-- 🔥 ГАМБУРГЕР-КНОПКА (видна только на мобильных < 992px) -->
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mobileMenu"
                aria-controls="mobileMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- 🔥 СКРЫВАЕМОЕ МЕНЮ -->
        <div class="collapse navbar-collapse" id="mobileMenu">
            <ul class="navbar-nav align-items-lg-center gap-2 gap-lg-3 w-100">

                <!-- Ссылки меню -->
                <li class="nav-item">
                    <a class="nav-link-custom py-2 py-lg-0" href="{% url 'core:about' %}">О компании</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link-custom py-2 py-lg-0" href="{% url 'services:services' %}">Услуги</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link-custom py-2 py-lg-0" href="{% url 'core:contacts' %}">Контакты</a>
                </li>

                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a href="{% url 'users:dashboard_router' %}" class="nav-link-custom py-2 py-lg-0">
                        Личный кабинет
                    </a>
                </li>
                {% endif %}

                <!-- Кнопки входа/выхода: на мобильном - на всю ширину, на ПК - компактно -->
                {% if not user.is_authenticated %}
                <li class="nav-item mt-2 mt-lg-0">
                    <a class="btn btn-soft-primary w-100 w-lg-auto" href="{% url 'users:login' %}">Войти</a>
                </li>
                {% else %}
                <li class="nav-item mt-2 mt-lg-0">
                    <form method="post" action="{% url 'users:logout' %}" class="w-100 w-lg-auto">
                        {% csrf_token %}
                        <button class="btn btn-soft-danger w-100 w-lg-auto">Выйти</button>
                    </form>
                </li>
                {% endif %}

            </ul>
        </div>
    </div>
</nav>
