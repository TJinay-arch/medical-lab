<!-- registration/login.html -->
{% extends "base.html" %}
{% block hero %}{% endblock %}
{% block content %}
<h2 class="text-center mb-4 fs-3">Авторизация</h2>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <form method="post" class="border p-4 rounded">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary w-100">
                    Войти
                </button>
            </form>

            <div class="text-center mt-4 small text-muted">
                Нет аккаунта?
                <a href="{% url 'users:register' %}" class="fw-semibold">
                    Зарегистрироваться
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
