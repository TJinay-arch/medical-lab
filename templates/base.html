<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} | МедЦентр „Здоровье Плюс“</title>

    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>

<body>

<header class="navbar-custom sticky-top">
    <div class="container d-flex align-items-center justify-content-between py-2">

        <!-- ЛОГО -->
        <a href="/" class="logo-link">
            <h5 class="logo mb-0">Здоровье Плюс</h5>
        </a>

        <div class="d-flex align-items-center gap-3">
            {% include 'core/menu.html' %}

            <!-- Переключатель темы -->
            <button id="themeToggle" class="btn btn-sm btn-light">
                🌙
            </button>
        </div>

    </div>
</header>

<section class="hero-section text-center">
    <div class="container">
        <h1 class="hero-title">{% block header_title %}{% endblock %}</h1>
        <p class="hero-subtitle">{% block lead_text %}{% endblock %}</p>
    </div>
</section>

<div class="container my-5">
    {% block content %}
    {% endblock %}
</div>

<footer class="footer-custom mt-5">
    <div class="container py-5">
        <div class="text-center text-muted">
            © 2024 МедЦентр
        </div>
    </div>
</footer>

<script src="/static/js/bootstrap.bundle.min.js"></script>

<script>
    const toggle = document.getElementById("themeToggle");
    const html = document.documentElement;

    const savedTheme = localStorage.getItem("theme") || "light";
    html.setAttribute("data-theme", savedTheme);

    toggle.innerText = savedTheme === "dark" ? "☀️" : "🌙";

    toggle.addEventListener("click", () => {
        const current = html.getAttribute("data-theme");
        const newTheme = current === "dark" ? "light" : "dark";

        html.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);

        toggle.innerText = newTheme === "dark" ? "☀️" : "🌙";
    });
</script>

</body>
</html>
