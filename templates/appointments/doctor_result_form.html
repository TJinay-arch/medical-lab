{% extends "base.html" %}

{% block title %}Результат приёма{% endblock %}
{% block header_title %}Заполнение результата{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="card-custom p-4">

        <h4 class="mb-3">Заключение врача</h4>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                {{ form.text.label_tag }}
                {{ form.text }}
            </div>

            <div class="mb-3">
                <label>Файл (PDF, анализы)</label>
                {{ form.file }}
            </div>

            <button class="btn btn-primary">
                Сохранить результат
            </button>

        </form>

    </div>

</div>

{% endblock %}
