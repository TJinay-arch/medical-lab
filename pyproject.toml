[tool.poetry]
name = "medical-lab"
package-mode = false
version = "0.1.0"
description = ""
authors = ["Ilya Payusov <ilya-payusov@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0.4"
psycopg2-binary = "^2.9.12"
pillow = "^12.2.0"
dotenv = "^0.9.9"
gunicorn = "^25.3.0"
pytest = "^9.0.3"


[tool.poetry.group.lint.dependencies]
black = "^26.3.1"
isort = "^8.0.1"
mypy = "^1.20.2"
flake8 = "^7.3.0"


[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^8.0.1"
flake8 = "^7.3.0"
mypy = "^1.20.2"
coverage = "^7.13.5"
pytest = "^9.0.3"
pytest-django = "^4.12.0"
pytest-cov = "^7.1.0"
factory-boy = "^3.3.3"
faker = "^40.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '\.git'

[tool.isort]
profile = "black"

# ─────────────────────────────────────────────────────────────
# 🧪 Тестирование и покрытие
# ─────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "--cov=users",
    "--cov=appointments",
    "--cov=core",
    "--cov=services",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--no-migrations", # Ускоряет тесты, миграции создаются автоматически
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["users", "appointments", "core", "services"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "manage.py",
    "config/*",
    "*/apps.py",
    "*/admin.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if settings.DEBUG",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 75  # 🔥 Блокируем мердж, если покрытие < 75%

[tool.coverage.html]
directory = "htmlcov"
