[tool.poetry]
name = "medical-lab"
package-mode = false
version = "0.1.0"
description = ""
authors = ["Ilya Payusov <ilya-payusov@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0.4"
psycopg2-binary = "^2.9.12"
pillow = "^12.2.0"
dotenv = "^0.9.9"
gunicorn = "^25.3.0"


[tool.poetry.group.lint.dependencies]
black = "^26.3.1"
isort = "^8.0.1"
mypy = "^1.20.2"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '\.git'

[tool.isort]
profile = "black"

