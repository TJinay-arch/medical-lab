# .github/workflows/ci.yml
name: 🧪 CI Pipeline

on:
  push:
    branches:
      - feature/basic_settings  # текущая ветка
      - develop                 # ветка разработки
  pull_request:
    branches:
      - develop
      - main

# Отменяем старые запуски при новом пуше в ту же ветку/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "1.8.0"
  POSTGRES_DB: medical_lab_test
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432

  # Django settings for CI
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ci-test-secret-key-do-not-use-in-production
  DEBUG: "False"

  # Email (mock settings for tests)
  PASSWORD_FOR_MAIL: ci-test-password

jobs:
  # ─────────────────────────────────────────────────────────────
  # 🧹 Lint & Code Quality
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install Poetry
        run: |
          pip install poetry==${{ env.POETRY_VERSION }}
          poetry config virtualenvs.create false

      - name: 📥 Install dependencies
        run: poetry install --no-root --only dev

      - name: 🎨 Check code formatting (Black)
        run: black --check --diff .

      - name: 🔤 Check imports order (isort)
        run: isort --check-only --diff .

      - name: 🔍 Run Flake8
        run: flake8 .

      - name: 🧪 Run MyPy (static type checking)
        run: mypy . --ignore-missing-imports || echo "⚠️ MyPy warnings (non-blocking)"

  # ─────────────────────────────────────────────────────────────
  # 🧪 Unit & Integration Tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Сервисы для тестов
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install Poetry
        run: |
          pip install poetry==${{ env.POETRY_VERSION }}
          poetry config virtualenvs.create false

      - name: 📥 Install dependencies
        run: poetry install --no-root

      - name: 🗄️ Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}; do
            echo "Waiting for PostgreSQL...";
            sleep 2;
          done

      - name: ⚙️ Run migrations
        env:
          DATABASE_URL: postgres://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }}
        run: python manage.py migrate --noinput


  # ─────────────────────────────────────────────────────────────
  # 🐳 Docker Build Check
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'  # только на пуш, не на PR

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🧪 Build Docker image (test only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/django/Dockerfile
          push: false
          load: true
          tags: medical-lab:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧹 Clean up Docker
        if: always()
        run: |
          docker rmi medical-lab:test-${{ github.sha }} || true

  # ─────────────────────────────────────────────────────────────
  # 📋 Security & Dependencies Check (опционально)
  # ─────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Poetry & dependencies
        run: |
          pip install poetry==${{ env.POETRY_VERSION }}
          poetry install --no-root

      - name: 🔍 Check for known vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --format json > pip-audit-report.json || echo "⚠️ Vulnerabilities found (see report)"

      - name: 📄 Upload security report (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-${{ github.run_id }}
          path: pip-audit-report.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # ✅ Summary Job (для наглядного статуса в PR)
  # ─────────────────────────────────────────────────────────────
  checks-passed:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [ lint, test, docker-build ]
    if: always()

    steps:
      - name: 📊 Check results
        run: |
          echo "🔍 Lint: ${{ needs.lint.result }}"
          echo "🧪 Tests: ${{ needs.test.result }}"
          echo "🐳 Docker: ${{ needs.docker-build.result }}"
          
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Some checks failed!"
            exit 1
          fi
          echo "✅ All required checks passed!"